<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>게시판 · 숏츠 브레이크</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0a0a' stroke='%23242424' stroke-width='2'/%3E%3Cpath d='M32 4 A28 28 0 0 1 60 30' fill='none' stroke='%23ff3b30' stroke-width='3' stroke-linecap='round'/%3E%3Crect x='21' y='15' width='20' height='30' rx='6' fill='%23141414' stroke='%23ff3b30' stroke-width='2.5'/%3E%3Cpath d='M27 23 L37 30 L27 37 Z' fill='%23ff3b30'/%3E%3Ccircle cx='46' cy='19' r='10' fill='%230a0a0a' stroke='%23ff3b30' stroke-width='2.5'/%3E%3Cline x1='40.5' y1='24.5' x2='51.5' y2='13.5' stroke='%23ff3b30' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg-0:#050505;
    --bg-1:#0d0d0d;
    --bg-2:#141414;
    --line:#242424;
    --red:#ff3b30;
    --red-dim:#7a1f1a;
    --red-glow: rgba(255,59,48,0.35);
    --text-0:#f2f0ee;
    --text-1:#a8a5a2;
    --text-2:#6b6866;
    --font-display: 'Space Grotesk', 'Pretendard', -apple-system, sans-serif;
    --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin:0;
    padding:0;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: var(--font-body);
    height:100%;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,59,48,0.10), transparent 45%),
      var(--bg-0);
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding: 28px 20px 40px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 2px 22px;
  }

  header h1{
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 0.02em;
    margin: 0;
    font-weight: 700;
  }
  header h1 .accent{ color: var(--red); }

  .home-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size: 12.5px;
    color: var(--text-1);
    text-decoration:none;
    border: 1px solid var(--line);
    padding: 7px 12px;
    border-radius: 999px;
    transition: border-color 0.15s, color 0.15s;
  }
  .home-link:hover{ border-color: var(--red); color: var(--text-0); }

  .notice{
    font-size: 12px;
    line-height:1.6;
    color: var(--text-2);
    background: rgba(255,59,48,0.05);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }
  .notice b{ color: var(--red); font-weight:600; }

  /* ---------- Write panel ---------- */
  .write-panel{
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 22px;
    box-shadow: 0 0 0 1px rgba(255,59,48,0.05), 0 24px 50px -30px rgba(255,59,48,0.25);
  }

  .write-panel .row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }

  input[type="text"], textarea{
    width:100%;
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text-0);
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: var(--font-body);
    outline:none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]::placeholder, textarea::placeholder{ color: var(--text-2); }
  input[type="text"]:focus, textarea:focus{
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,59,48,0.15);
  }

  #nickname{ max-width: 140px; flex-shrink:0; }
  #title{ flex:1; }

  textarea{
    resize: vertical;
    min-height: 80px;
    line-height:1.5;
    margin-bottom: 10px;
  }

  .write-actions{
    display:flex;
    justify-content:flex-end;
  }

  button#postBtn{
    border:none;
    background: var(--red);
    color:#1a0402;
    font-weight:600;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 10px;
    cursor:pointer;
    transition: transform 0.12s, filter 0.12s;
  }
  button#postBtn:hover{ filter:brightness(1.08); }
  button#postBtn:active{ transform: scale(0.97); }

  .form-error{
    font-size: 12px;
    color: #ffb3ad;
    margin: -2px 0 10px;
    display:none;
  }

  /* ---------- Post list ---------- */
  .list-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .list-head span{
    font-size: 12.5px;
    color: var(--text-1);
    letter-spacing:0.03em;
  }

  .posts{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .post{
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    animation: rise 0.25s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .post-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom: 6px;
  }

  .post-title{
    font-size: 15px;
    font-weight:600;
    color: var(--text-0);
    word-break: break-word;
  }

  .post-del{
    flex-shrink:0;
    background:none;
    border:none;
    color: var(--text-2);
    font-size: 11.5px;
    cursor:pointer;
    padding: 2px 4px;
    transition: color 0.15s;
  }
  .post-del:hover{ color: var(--red); }

  .post-meta{
    display:flex;
    gap:8px;
    align-items:center;
    font-size: 11.5px;
    color: var(--text-2);
    margin-bottom: 10px;
  }
  .post-meta .nick{ color: var(--red); font-weight:600; }

  .post-content{
    font-size: 13.5px;
    line-height:1.65;
    color: var(--text-1);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty{
    text-align:center;
    color: var(--text-2);
    font-size: 13px;
    padding: 40px 10px;
    border: 1px dashed var(--line);
    border-radius: 14px;
  }

  @media (max-width: 420px){
    .app{ padding: 18px 12px 28px; }
    #nickname{ max-width: 96px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>게시판 <span class="accent">·</span> 숏츠 브레이크</h1>
    <a class="home-link" href="index.html">← 홈으로</a>
  </header>

  <div class="notice">
    <b>안내</b> · 이 게시판은 별도의 서버 저장소 없이, 지금 보고 계신 <b>이 브라우저 안에만</b> 글이 저장돼요. 다른 기기나 다른 사람과는 공유되지 않는 개인 메모용 게시판이에요. 여러 사람이 함께 보는 게시판이 필요하면 말씀해주세요, 서버 저장 기능을 추가해드릴게요.
  </div>

  <div class="write-panel">
    <div class="row">
      <input type="text" id="nickname" placeholder="닉네임 (선택)" maxlength="20" />
      <input type="text" id="title" placeholder="제목" maxlength="100" />
    </div>
    <textarea id="content" placeholder="숏폼 절제 관련 팁, 다짐, 후기 등을 자유롭게 남겨보세요." maxlength="2000"></textarea>
    <div class="form-error" id="formError"></div>
    <div class="write-actions">
      <button id="postBtn">게시하기</button>
    </div>
  </div>

  <div class="list-head">
    <span>전체 글</span>
    <span id="postCount">0개</span>
  </div>

  <div class="posts" id="posts"></div>

</div>

<script>
  const STORAGE_KEY = 'shorts-break-board-posts';

  const nicknameEl = document.getElementById('nickname');
  const titleEl = document.getElementById('title');
  const contentEl = document.getElementById('content');
  const errorEl = document.getElementById('formError');
  const postsEl = document.getElementById('posts');
  const countEl = document.getElementById('postCount');
  const postBtn = document.getElementById('postBtn');

  function loadPosts(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e){
      return [];
    }
  }

  function savePosts(posts){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  }

  function formatDate(iso){
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render(){
    const posts = loadPosts();
    countEl.textContent = posts.length + '개';

    if(posts.length === 0){
      postsEl.innerHTML = '<div class="empty">아직 등록된 글이 없어요. 첫 글을 남겨보세요.</div>';
      return;
    }

    postsEl.innerHTML = posts.map(p => `
      <div class="post" data-id="${p.id}">
        <div class="post-top">
          <div class="post-title">${escapeHtml(p.title)}</div>
          <button class="post-del" data-id="${p.id}">삭제</button>
        </div>
        <div class="post-meta">
          <span class="nick">${escapeHtml(p.nickname || '익명')}</span>
          <span>${formatDate(p.createdAt)}</span>
        </div>
        <div class="post-content">${escapeHtml(p.content)}</div>
      </div>
    `).join('');
  }

  function showError(msg){
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function clearError(){
    errorEl.style.display = 'none';
    errorEl.textContent = '';
  }

  function submitPost(){
    const nickname = nicknameEl.value.trim();
    const title = titleEl.value.trim();
    const content = contentEl.value.trim();

    if(!title){
      showError('제목을 입력해주세요.');
      titleEl.focus();
      return;
    }
    if(!content){
      showError('내용을 입력해주세요.');
      contentEl.focus();
      return;
    }
    clearError();

    const posts = loadPosts();
    posts.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      nickname: nickname.slice(0, 20),
      title: title.slice(0, 100),
      content: content.slice(0, 2000),
      createdAt: new Date().toISOString()
    });
    savePosts(posts);

    titleEl.value = '';
    contentEl.value = '';
    render();
  }

  postBtn.addEventListener('click', submitPost);
  contentEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      e.preventDefault();
      submitPost();
    }
  });

  postsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.post-del');
    if(!btn) return;
    const id = btn.dataset.id;
    if(!confirm('이 글을 삭제할까요?')) return;
    const posts = loadPosts().filter(p => p.id !== id);
    savePosts(posts);
    render();
  });

  render();
</script>
</body>
</html>
