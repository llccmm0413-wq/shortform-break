<div class="flex items-baseline gap-1 mt-1">
<span class="font-display-lg text-display-lg text-on-background">42</span>
<span class="font-headline-lg text-headline-lg text-outline">/ 60분</span>
</div>
<p class="mt-2 text-label-sm font-label-sm text-tertiary font-bold px-3 py-1 bg-tertiary/10 rounded-full">남은 시간 18분</p>
</div>
</div>
<div class="mt-stack-md w-full max-w-sm">
<button class="w-full bg-primary text-on-primary font-bold py-4 rounded-full flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-95 transition-transform">

</div>
</section>

<p class="text-body-md font-body-md text-on-surface-variant leading-relaxed">

</div>

<div class="bg-surface-container-highest border border-outline-variant p-stack-md rounded-xl flex flex-col justify-between">

<script>
        // Micro-interaction for the progress circle or button
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> 처리 중...';
            setTimeout(() => {
                btn.innerHTML = originalText;
                alert('숏폼 차단 기능이 활성화되었습니다.');
            }, 1000);
        });
