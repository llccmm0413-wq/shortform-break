<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>숏츠 브레이크 · 숏폼 절제 도우미</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0a0a' stroke='%23242424' stroke-width='2'/%3E%3Cpath d='M32 4 A28 28 0 0 1 60 30' fill='none' stroke='%23ff3b30' stroke-width='3' stroke-linecap='round'/%3E%3Crect x='21' y='15' width='20' height='30' rx='6' fill='%23141414' stroke='%23ff3b30' stroke-width='2.5'/%3E%3Cpath d='M27 23 L37 30 L27 37 Z' fill='%23ff3b30'/%3E%3Ccircle cx='46' cy='19' r='10' fill='%230a0a0a' stroke='%23ff3b30' stroke-width='2.5'/%3E%3Cline x1='40.5' y1='24.5' x2='51.5' y2='13.5' stroke='%23ff3b30' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg-0:#050505;
    --bg-1:#0d0d0d;
    --bg-2:#141414;
    --line:#242424;
    --red:#ff3b30;
    --red-dim:#7a1f1a;
    --red-glow: rgba(255,59,48,0.35);
    --text-0:#f2f0ee;
    --text-1:#a8a5a2;
    --text-2:#6b6866;
    --font-display: 'Space Grotesk', 'Pretendard', -apple-system, sans-serif;
    --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin:0;
    padding:0;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: var(--font-body);
    height:100%;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,59,48,0.10), transparent 45%),
      var(--bg-0);
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding: 28px 20px 20px;
  }

  /* ---------- Header / Icon ---------- */
  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding: 18px 0 20px;
  }

  .mark{
    width:64px;
    height:64px;
    margin-bottom:14px;
    filter: drop-shadow(0 0 18px var(--red-glow));
    animation: pulse 3.2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100% { filter: drop-shadow(0 0 12px var(--red-glow)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 22px var(--red-glow)); transform: scale(1.03); }
  }

  .mark .ring{
    transform-origin: 32px 32px;
    animation: spin 5s linear infinite;
  }

  @keyframes spin{
    to { transform: rotate(360deg); }
  }

  .mark .badge-slash{
    transform-origin: 46px 19px;
    animation: badge-pop 3.2s ease-in-out infinite;
  }

  @keyframes badge-pop{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  h1{
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    font-weight: 700;
  }
  h1 .accent{ color: var(--red); }

  header p{
    margin:0;
    color: var(--text-1);
    font-size: 13.5px;
    line-height:1.5;
    max-width: 380px;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    margin: 20px 0 18px;
  }

  .tab{
    flex:1;
    border:none;
    background:transparent;
    color: var(--text-1);
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight:600;
    padding: 9px 0;
    border-radius: 999px;
    cursor:pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active{
    background: var(--red);
    color: #1a0402;
  }
  .tab:not(.active):hover{ color: var(--text-0); }

  .view{ display:none; flex-direction:column; flex:1; }
  .view.active{ display:flex; }

  /* ---------- Chat panel ---------- */
  .panel{
    flex:1;
    display:flex;
    flex-direction:column;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(255,59,48,0.05), 0 30px 60px -30px rgba(255,59,48,0.25);
  }

  .panel-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,59,48,0.04);
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red-glow);
  }
  .panel-head span{
    font-size:12.5px;
    color: var(--text-1);
    letter-spacing: 0.03em;
  }

  .messages{
    flex:1;
    padding: 18px;
    display:flex;
    flex-direction:column;
    gap: 14px;
    overflow-y:auto;
    min-height: 320px;
    max-height: 52vh;
  }

  .messages::-webkit-scrollbar{ width:6px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }

  .msg{
    max-width: 88%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    animation: rise 0.25s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .msg.system{
    align-self:flex-start;
    background: var(--bg-1);
    border: 1px solid var(--line);
    color: var(--text-1);
  }

  .msg.user{
    align-self:flex-end;
    background: var(--red);
    color: #1a0402;
    font-weight:500;
    border-bottom-right-radius: 4px;
  }

  .msg.ai{
    align-self:flex-start;
    background: var(--bg-2);
    border: 1px solid var(--red-dim);
    border-bottom-left-radius: 4px;
    color: var(--text-0);
  }

  .msg.ai .badge{
    display:inline-block;
    font-size:10.5px;
    color: var(--red);
    letter-spacing:0.08em;
    margin-bottom:6px;
    font-weight:700;
  }

  .msg.error{
    align-self:flex-start;
    background: rgba(255,59,48,0.1);
    border: 1px solid var(--red);
    color: #ffb3ad;
  }

  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding: 12px 14px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background: var(--red);
    opacity:0.4;
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes blink{
    0%, 80%, 100% { opacity:0.25; }
    40% { opacity:1; }
  }

  .input-row{
    display:flex;
    gap:10px;
    padding: 14px;
    border-top: 1px solid var(--line);
    background: var(--bg-1);
  }

  textarea{
    flex:1;
    resize:none;
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text-0);
    padding: 12px 14px;
    font-size: 14px;
    font-family: var(--font-body);
    line-height:1.5;
    min-height: 46px;
    max-height: 120px;
    outline:none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea::placeholder{ color: var(--text-2); }
  textarea:focus{
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,59,48,0.15);
  }

  button#sendBtn{
    flex-shrink:0;
    width:46px;
    height:46px;
    border-radius:12px;
    border:none;
    background: var(--red);
    color:#1a0402;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.12s, filter 0.12s;
  }
  button#sendBtn:hover{ filter:brightness(1.08); }
  button#sendBtn:active{ transform: scale(0.94); }
  button#sendBtn:disabled{ opacity:0.4; cursor:not-allowed; }

  .hint{
    text-align:center;
    color: var(--text-2);
    font-size: 11.5px;
    margin-top: 14px;
    letter-spacing: 0.02em;
  }

  /* ---------- Board view ---------- */
  .notice{
    font-size: 12px;
    line-height:1.6;
    color: var(--text-2);
    background: rgba(255,59,48,0.05);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .notice b{ color: var(--red); font-weight:600; }

  .write-panel{
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 0 0 1px rgba(255,59,48,0.05), 0 24px 50px -30px rgba(255,59,48,0.25);
  }

  .write-panel .row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }

  input[type="text"]{
    width:100%;
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text-0);
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: var(--font-body);
    outline:none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]::placeholder{ color: var(--text-2); }
  input[type="text"]:focus{
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,59,48,0.15);
  }

  #bNickname{ max-width: 140px; flex-shrink:0; }
  #bTitle{ flex:1; }

  #bContent{
    width:100%;
    resize: vertical;
    min-height: 80px;
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text-0);
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: var(--font-body);
    line-height:1.5;
    outline:none;
    margin-bottom: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #bContent::placeholder{ color: var(--text-2); }
  #bContent:focus{
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,59,48,0.15);
  }

  .write-actions{
    display:flex;
    justify-content:flex-end;
  }

  button#postBtn{
    border:none;
    background: var(--red);
    color:#1a0402;
    font-weight:600;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 10px;
    cursor:pointer;
    transition: transform 0.12s, filter 0.12s;
  }
  button#postBtn:hover{ filter:brightness(1.08); }
  button#postBtn:active{ transform: scale(0.97); }
  button#postBtn:disabled{ opacity:0.5; cursor:not-allowed; }

  .form-error{
    font-size: 12px;
    color: #ffb3ad;
    margin: -2px 0 10px;
    display:none;
  }

  .list-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .list-head span{
    font-size: 12.5px;
    color: var(--text-1);
    letter-spacing:0.03em;
  }

  .posts{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }

  .post{
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    animation: rise 0.25s ease;
  }

  .post-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom: 6px;
  }

  .post-title{
    font-size: 15px;
    font-weight:600;
    color: var(--text-0);
    word-break: break-word;
  }

  .post-del{
    flex-shrink:0;
    background:none;
    border:none;
    color: var(--text-2);
    font-size: 11.5px;
    cursor:pointer;
    padding: 2px 4px;
    transition: color 0.15s;
  }
  .post-del:hover{ color: var(--red); }

  .post-meta{
    display:flex;
    gap:8px;
    align-items:center;
    font-size: 11.5px;
    color: var(--text-2);
    margin-bottom: 10px;
  }
  .post-meta .nick{ color: var(--red); font-weight:600; }

  .post-content{
    font-size: 13.5px;
    line-height:1.65;
    color: var(--text-1);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty{
    text-align:center;
    color: var(--text-2);
    font-size: 13px;
    padding: 40px 10px;
    border: 1px dashed var(--line);
    border-radius: 14px;
  }

  @media (max-width: 420px){
    .app{ padding: 18px 12px 12px; }
    .messages{ max-height: 58vh; }
    #bNickname{ max-width: 96px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="숏츠 브레이크 로고: 숏폼 재생 프레임과 제한 배지의 합성 아이콘">
      <circle cx="32" cy="32" r="29" fill="#0a0a0a" stroke="#242424" stroke-width="1.5"/>
      <g class="ring">
        <path d="M32 4 A28 28 0 0 1 60 30" fill="none" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <rect x="21" y="15" width="20" height="30" rx="6" fill="#141414" stroke="#ff3b30" stroke-width="2.2"/>
      <path d="M27 23 L37 30 L27 37 Z" fill="#ff3b30"/>
      <g class="badge-slash">
        <circle cx="46" cy="19" r="10.5" fill="#0a0a0a" stroke="#ff3b30" stroke-width="2.5"/>
        <line x1="40" y1="25" x2="52" y2="13" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>
    <h1>숏츠 브레이크 <span class="accent">·</span> 숏폼 절제 도우미</h1>
    <p>줄이고 싶은 숏폼 습관을 말해주면, AI가 상황에 맞는 제한 기능을 설계해드려요.</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabChatBtn" data-tab="chat">AI 분석</button>
    <button class="tab" id="tabBoardBtn" data-tab="board">게시판</button>
  </div>

  <!-- ================= AI 분석 뷰 ================= -->
  <section class="view active" id="chatView">
    <div class="panel">
      <div class="panel-head">
        <span class="dot"></span>
        <span>AI 분석 세션 · 연결됨</span>
      </div>

      <div class="messages" id="messages">
        <div class="msg system">예시: "밤에 유튜브 쇼츠를 2시간씩 봐요, 잠들기 전에 멈추고 싶어요" 처럼 편하게 적어주세요.</div>
      </div>

      <div class="input-row">
        <textarea id="input" placeholder="숏폼 제한을 위해 어떤 기능이 필요한지 적어주세요..." rows="1"></textarea>
        <button id="sendBtn" aria-label="전송">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="#1a0402" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="hint">Gemini 기반 · 입력한 내용은 기능 추천 목적 외에 저장되지 않습니다</div>
  </section>

  <!-- ================= 게시판 뷰 ================= -->
  <section class="view" id="boardView">
    <div class="notice">
      <b>안내</b> · 이 게시판은 서버에 저장돼서 <b>모든 방문자에게 함께 보여요</b>. 다른 사람을 배려하는 내용으로 남겨주세요.
    </div>

    <div class="write-panel">
      <div class="row">
        <input type="text" id="bNickname" placeholder="닉네임 (선택)" maxlength="20" />
        <input type="text" id="bTitle" placeholder="제목" maxlength="100" />
      </div>
      <textarea id="bContent" placeholder="숏폼 절제 관련 팁, 다짐, 후기 등을 자유롭게 남겨보세요." maxlength="2000"></textarea>
      <div class="form-error" id="bFormError"></div>
      <div class="write-actions">
        <button id="postBtn">게시하기</button>
      </div>
    </div>

    <div class="list-head">
      <span>전체 글</span>
      <span id="bPostCount">0개</span>
    </div>

    <div class="posts" id="bPosts">
      <div class="empty">불러오는 중...</div>
    </div>
  </section>

</div>

<script>
  /* ---------------- 탭 전환 ---------------- */
  const tabChatBtn = document.getElementById('tabChatBtn');
  const tabBoardBtn = document.getElementById('tabBoardBtn');
  const chatView = document.getElementById('chatView');
  const boardView = document.getElementById('boardView');

  let boardLoaded = false;

  function activateTab(tab){
    const isChat = tab === 'chat';
    tabChatBtn.classList.toggle('active', isChat);
    tabBoardBtn.classList.toggle('active', !isChat);
    chatView.classList.toggle('active', isChat);
    boardView.classList.toggle('active', !isChat);

    if(!isChat){
      fetchPosts();
    }
  }

  tabChatBtn.addEventListener('click', () => activateTab('chat'));
  tabBoardBtn.addEventListener('click', () => activateTab('board'));

  /* ---------------- AI 분석 채팅 ---------------- */
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function addMessage(role, text){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if(role === 'ai'){
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = 'AI 추천 기능';
      div.appendChild(badge);
      const body = document.createElement('div');
      body.textContent = text;
      div.appendChild(body);
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping(){
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const el = document.getElementById('typingIndicator');
    if(el) el.remove();
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text) return;

    addMessage('user', text);
    input.value = '';
    autoGrow();
    sendBtn.disabled = true;
    addTyping();

    try{
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      removeTyping();

      if(!res.ok){
        addMessage('error', data.error || '요청 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
        return;
      }

      addMessage('ai', data.result);
    } catch(err){
      removeTyping();
      addMessage('error', '서버에 연결할 수 없습니다. 네트워크 상태를 확인해주세요.');
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  /* ---------------- 게시판 (서버 저장) ---------------- */
  const bNickname = document.getElementById('bNickname');
  const bTitle = document.getElementById('bTitle');
  const bContent = document.getElementById('bContent');
  const bFormError = document.getElementById('bFormError');
  const bPostsEl = document.getElementById('bPosts');
  const bCountEl = document.getElementById('bPostCount');
  const postBtn = document.getElementById('postBtn');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso){
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function showBoardError(msg){
    bFormError.textContent = msg;
    bFormError.style.display = 'block';
  }
  function clearBoardError(){
    bFormError.style.display = 'none';
    bFormError.textContent = '';
  }

  function renderPosts(posts){
    bCountEl.textContent = posts.length + '개';

    if(posts.length === 0){
      bPostsEl.innerHTML = '<div class="empty">아직 등록된 글이 없어요. 첫 글을 남겨보세요.</div>';
      return;
    }

    bPostsEl.innerHTML = posts.map(p => `
      <div class="post" data-id="${p.id}">
        <div class="post-top">
          <div class="post-title">${escapeHtml(p.title)}</div>
          <button class="post-del" data-id="${p.id}">삭제</button>
        </div>
        <div class="post-meta">
          <span class="nick">${escapeHtml(p.nickname || '익명')}</span>
          <span>${formatDate(p.createdAt)}</span>
        </div>
        <div class="post-content">${escapeHtml(p.content)}</div>
      </div>
    `).join('');
  }

  async function fetchPosts(){
    bPostsEl.innerHTML = '<div class="empty">불러오는 중...</div>';
    try{
      const res = await fetch('/api/board');
      const data = await res.json();
      if(!res.ok){
        bPostsEl.innerHTML = `<div class="empty">${escapeHtml(data.error || '게시글을 불러오지 못했습니다.')}</div>`;
        return;
      }
      renderPosts(data.posts || []);
      boardLoaded = true;
    } catch(err){
      bPostsEl.innerHTML = '<div class="empty">서버에 연결할 수 없습니다. 네트워크 상태를 확인해주세요.</div>';
    }
  }

  async function submitPost(){
    const nickname = bNickname.value.trim();
    const title = bTitle.value.trim();
    const content = bContent.value.trim();

    if(!title){
      showBoardError('제목을 입력해주세요.');
      bTitle.focus();
      return;
    }
    if(!content){
      showBoardError('내용을 입력해주세요.');
      bContent.focus();
      return;
    }
    clearBoardError();

    postBtn.disabled = true;
    try{
      const res = await fetch('/api/board', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, title, content })
      });
      const data = await res.json();

      if(!res.ok){
        showBoardError(data.error || '게시에 실패했습니다.');
        return;
      }

      bTitle.value = '';
      bContent.value = '';
      fetchPosts();
    } catch(err){
      showBoardError('서버에 연결할 수 없습니다. 네트워크 상태를 확인해주세요.');
    } finally {
      postBtn.disabled = false;
    }
  }

  postBtn.addEventListener('click', submitPost);
  bContent.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      e.preventDefault();
      submitPost();
    }
  });

  bPostsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.post-del');
    if(!btn) return;
    const id = btn.dataset.id;
    if(!confirm('이 글을 삭제할까요?')) return;

    btn.disabled = true;
    try{
      const res = await fetch('/api/board?id=' + encodeURIComponent(id), { method: 'DELETE' });
      if(!res.ok){
        const data = await res.json().catch(() => ({}));
        alert(data.error || '삭제에 실패했습니다.');
        btn.disabled = false;
        return;
      }
      fetchPosts();
    } catch(err){
      alert('서버에 연결할 수 없습니다.');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
