<!DOCTYPE html>
<html lang="ko">
<head>

          "on-error": "#ffffff",
          "on-primary": "#ffffff",

          "surface-dim": "#cbdbf5",

          "tertiary-container": "#cf2c30",
          "surface-container-highest": "#d3e4fe",
          "tertiary-fixed-dim": "#ffb3ad",
          "primary-fixed-dim": "#b4c5ff",

          "surface-tint": "#0053db",
          "inverse-surface": "#213145",
          "primary-fixed": "#dbe1ff",
          "on-tertiary": "#ffffff",
          "surface-variant": "#d3e4fe",
          "surface": "#f8f9ff",
          "on-surface-variant": "#434655",
          "surface-bright": "#f8f9ff"
        },

<style>
  body { font-family: 'Hanken Grotesk', sans-serif; }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(226, 232, 240, 0.5);
  }
  @keyframes pulse-slow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(0.98); }
  }
  .animate-pulse-slow { animation: pulse-slow 3s infinite ease-in-out; }
  .msg-enter { animation: rise 0.25s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #messages::-webkit-scrollbar, #bPosts { scrollbar-width: thin; }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: #c3c6d7; border-radius: 3px; }
  textarea, input[type="text"] { font-family: 'Hanken Grotesk', sans-serif; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24">

<!-- ================= TopAppBar ================= -->
<header class="w-full top-0 sticky z-40 bg-background/80 backdrop-blur-md border-b border-outline-variant">
  <div class="flex items-center justify-between px-container-padding py-base w-full max-w-7xl mx-auto">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
      <span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary text-[20px]">쇼츠스탑</span>
    </div>
    <span class="flex items-center gap-1 text-label-sm font-label-sm text-primary uppercase bg-primary-container/10 px-3 py-1 rounded-full">
      <span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
      Live
    </span>
  </div>
</header>

<main class="max-w-7xl mx-auto px-container-padding">

  <!-- ================= Page Title ================= -->
  <section class="pt-stack-md pb-stack-sm">
    <h1 id="pageTitle" class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-background">AI 분석</h1>
    <p id="pageSubtitle" class="text-body-md font-body-md text-on-surface-variant mt-1">
      줄이고 싶은 숏폼 습관을 말해주면, AI가 상황에 맞는 제한 기능을 설계해드려요.
    </p>
  </section>

  <!-- ================= AI 분석 뷰 ================= -->
  <section id="chatView" class="flex flex-col">
    <div class="bg-surface-container-lowest border border-outline-variant rounded-3xl overflow-hidden flex flex-col">
      <div id="messages" class="flex flex-col gap-gutter p-gutter overflow-y-auto" style="min-height:340px; max-height:52vh;">
        <div class="flex justify-center">
          <span class="text-label-sm font-label-sm px-3 py-1 bg-surface-container-low border border-outline-variant rounded-full text-on-surface-variant">
            예시: "밤에 유튜브 쇼츠를 2시간씩 봐요, 잠들기 전에 멈추고 싶어요"
          </span>
        </div>
      </div>

      <div class="border-t border-outline-variant p-stack-sm bg-surface-container-low">
        <div class="flex items-center gap-2 bg-surface-container-lowest border border-outline-variant rounded-full px-4 py-2">
          <textarea id="input" rows="1" placeholder="숏폼 제한을 위해 어떤 기능이 필요한지 적어주세요..."
            class="flex-1 bg-transparent border-none focus:ring-0 outline-none resize-none text-body-md font-body-md placeholder:text-on-surface-variant max-h-28"></textarea>
          <button id="sendBtn" aria-label="전송"
            class="flex-shrink-0 w-9 h-9 rounded-full bg-primary text-on-primary flex items-center justify-center active:scale-90 transition-transform disabled:opacity-40">
            <span class="material-symbols-outlined text-[20px]">send</span>
          </button>
        </div>
      </div>
    </div>
    <p class="text-center text-label-sm font-label-sm text-on-surface-variant mt-stack-sm">
      Gemini 기반 · 입력한 내용은 기능 추천 목적 외에 저장되지 않습니다
    </p>
  </section>

  <!-- ================= 게시판 뷰 ================= -->
  <section id="boardView" class="hidden flex-col gap-stack-md">
    <div class="flex items-center gap-2 bg-primary-container/10 border border-outline-variant rounded-2xl px-gutter py-3">
      <span class="material-symbols-outlined text-primary text-[20px]">public</span>
      <p class="text-label-sm font-label-sm text-on-surface-variant leading-relaxed">
        이 게시판은 서버에 저장돼서 <span class="text-primary font-bold">모든 방문자에게 함께</span> 보여요. 다른 사람을 배려하는 내용으로 남겨주세요.
      </p>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-3xl p-gutter flex flex-col gap-stack-sm">
      <div class="flex gap-2">
        <input type="text" id="bNickname" placeholder="닉네임 (선택)" maxlength="20"
          class="w-32 flex-shrink-0 bg-surface-container-low border border-outline-variant rounded-full px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
        <input type="text" id="bTitle" placeholder="제목" maxlength="100"
          class="flex-1 bg-surface-container-low border border-outline-variant rounded-full px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
      </div>
      <textarea id="bContent" placeholder="숏폼 절제 관련 팁, 다짐, 후기 등을 자유롭게 남겨보세요." maxlength="2000"
        class="w-full min-h-[88px] bg-surface-container-low border border-outline-variant rounded-2xl px-4 py-3 text-body-md resize-y focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary"></textarea>
      <div id="bFormError" class="hidden text-label-sm font-label-sm text-error"></div>
      <div class="flex justify-end">
        <button id="postBtn" class="bg-primary text-on-primary font-bold px-6 py-2.5 rounded-full active:scale-95 transition-transform disabled:opacity-50">
          게시하기
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between px-1">
      <h3 class="font-headline-lg-mobile text-headline-lg-mobile text-[16px] text-on-background">전체 글</h3>
      <span id="bPostCount" class="text-label-sm font-label-sm text-on-surface-variant">0개</span>
    </div>

    <div id="bPosts" class="flex flex-col gap-gutter">
      <div class="text-center text-label-sm font-label-sm text-on-surface-variant py-10 border border-dashed border-outline-variant rounded-2xl">
        불러오는 중...
      </div>
    </div>
  </section>

</main>

<!-- ================= BottomNavBar ================= -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-container-padding pb-6 pt-2 bg-surface-container-lowest border-t border-outline-variant">
  <button id="tabChatBtn" data-tab="chat"
    class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-1.5 active:scale-90 transition-transform duration-200">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
    <span class="font-label-sm text-label-sm mt-0.5">AI 분석</span>
  </button>
  <button id="tabBoardBtn" data-tab="board"
    class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-1.5 hover:bg-surface-container-high rounded-full transition-colors active:scale-90 transition-transform duration-200">
    <span class="material-symbols-outlined">forum</span>
    <span class="font-label-sm text-label-sm mt-0.5">게시판</span>
  </button>
</nav>

<script>
  /* ---------------- 탭 전환 ---------------- */
  const tabChatBtn = document.getElementById('tabChatBtn');
  const tabBoardBtn = document.getElementById('tabBoardBtn');
  const chatView = document.getElementById('chatView');
  const boardView = document.getElementById('boardView');
  const pageTitle = document.getElementById('pageTitle');
  const pageSubtitle = document.getElementById('pageSubtitle');

  const ACTIVE_CLASSES = ['bg-primary-container', 'text-on-primary-container'];
  const INACTIVE_CLASSES = ['text-on-surface-variant', 'hover:bg-surface-container-high'];

  function setTabStyle(btn, active){
    if(active){
      btn.classList.add(...ACTIVE_CLASSES);
      btn.classList.remove(...INACTIVE_CLASSES);
    } else {
      btn.classList.remove(...ACTIVE_CLASSES);
      btn.classList.add(...INACTIVE_CLASSES);
    }
  }

  function activateTab(tab){
    const isChat = tab === 'chat';
    setTabStyle(tabChatBtn, isChat);
    setTabStyle(tabBoardBtn, !isChat);

    chatView.classList.toggle('hidden', !isChat);
    chatView.classList.toggle('flex', isChat);
    boardView.classList.toggle('hidden', isChat);
    boardView.classList.toggle('flex', !isChat);

    if(isChat){
      pageTitle.textContent = 'AI 분석';
      pageSubtitle.textContent = '줄이고 싶은 숏폼 습관을 말해주면, AI가 상황에 맞는 제한 기능을 설계해드려요.';
    } else {
      pageTitle.textContent = '게시판';
      pageSubtitle.textContent = '숏폼 절제 팁과 다짐을 다른 사용자와 함께 나눠보세요.';
      fetchPosts();
    }
  }

  tabChatBtn.addEventListener('click', () => activateTab('chat'));
  tabBoardBtn.addEventListener('click', () => activateTab('board'));

  /* ---------------- AI 분석 채팅 ---------------- */
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 112) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function nowLabel(){
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function addMessage(role, text){
    const wrap = document.createElement('div');
    wrap.className = 'msg-enter flex flex-col gap-1 max-w-[88%]' + (role === 'user' ? ' self-end items-end' : ' items-start');

    if(role === 'ai'){
      wrap.innerHTML = `
        <div class="flex items-center gap-1.5 ml-1">
          <span class="material-symbols-outlined text-primary text-[16px]">auto_awesome</span>
          <span class="font-label-sm text-label-sm text-primary uppercase">AI 추천 기능</span>
        </div>
        <div class="glass-card bg-surface-container-low border-l-4 border-l-primary rounded-2xl p-gutter">
          <p class="text-body-md font-body-md text-on-background leading-relaxed whitespace-pre-wrap"></p>
        </div>
        <span class="text-[10px] font-label-sm text-on-surface-variant ml-1">${nowLabel()}</span>
      `;
      wrap.querySelector('p').textContent = text;
    } else if(role === 'error'){
      wrap.innerHTML = `
        <div class="bg-tertiary-container/10 border-l-4 border-l-tertiary rounded-2xl p-gutter">
          <p class="text-body-md font-body-md text-tertiary leading-relaxed whitespace-pre-wrap"></p>
        </div>
      `;
      wrap.querySelector('p').textContent = text;
    } else if(role === 'system'){
      wrap.className = 'flex justify-center w-full max-w-full';
      wrap.innerHTML = `<span class="text-label-sm font-label-sm px-3 py-1 bg-surface-container-low border border-outline-variant rounded-full text-on-surface-variant"></span>`;
      wrap.querySelector('span').textContent = text;
    } else {
      wrap.innerHTML = `
        <div class="bg-primary text-on-primary rounded-2xl rounded-br-md px-4 py-2.5">
          <p class="text-body-md leading-relaxed whitespace-pre-wrap"></p>
        </div>
        <span class="text-[10px] font-label-sm text-on-surface-variant mr-1">${nowLabel()}</span>
      `;
      wrap.querySelector('p').textContent = text;
    }

    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function addTyping(){
    const div = document.createElement('div');
    div.className = 'msg-enter flex items-center gap-1.5 self-start';
    div.id = 'typingIndicator';
    div.innerHTML = `
      <span class="w-2 h-2 rounded-full bg-primary opacity-40 animate-pulse-slow"></span>
      <span class="w-2 h-2 rounded-full bg-primary opacity-40 animate-pulse-slow" style="animation-delay:0.15s"></span>
      <span class="w-2 h-2 rounded-full bg-primary opacity-40 animate-pulse-slow" style="animation-delay:0.3s"></span>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const el = document.getElementById('typingIndicator');
    if(el) el.remove();
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text) return;

    addMessage('user', text);
    input.value = '';
    autoGrow();
    sendBtn.disabled = true;
    addTyping();

    try{
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      removeTyping();

      if(!res.ok){
        addMessage('error', data.error || '요청 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
        return;
      }

      addMessage('ai', data.result);
    } catch(err){
      removeTyping();
      addMessage('error', '서버에 연결할 수 없습니다. 네트워크 상태를 확인해주세요.');
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  /* ---------------- 게시판 (서버 저장) ---------------- */
  const bNickname = document.getElementById('bNickname');
  const bTitle = document.getElementById('bTitle');
  const bContent = document.getElementById('bContent');
  const bFormError = document.getElementById('bFormError');
  const bPostsEl = document.getElementById('bPosts');
  const bCountEl = document.getElementById('bPostCount');
  const postBtn = document.getElementById('postBtn');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso){
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function showBoardError(msg){
    bFormError.textContent = msg;
    bFormError.classList.remove('hidden');
  }
  function clearBoardError(){
    bFormError.classList.add('hidden');
    bFormError.textContent = '';
  }

  function renderPosts(posts){
    bCountEl.textContent = posts.length + '개';

    if(posts.length === 0){
      bPostsEl.innerHTML = '<div class="text-center text-label-sm font-label-sm text-on-surface-variant py-10 border border-dashed border-outline-variant rounded-2xl">아직 등록된 글이 없어요. 첫 글을 남겨보세요.</div>';
      return;
    }

    bPostsEl.innerHTML = posts.map(p => `
      <div class="msg-enter bg-surface-container-lowest border border-outline-variant rounded-2xl p-gutter" data-id="${p.id}">
        <div class="flex items-start justify-between gap-2 mb-1">
          <h4 class="font-bold text-on-background break-words">${escapeHtml(p.title)}</h4>
          <button class="post-del flex-shrink-0 text-label-sm font-label-sm text-on-surface-variant hover:text-tertiary transition-colors" data-id="${p.id}">삭제</button>
        </div>
        <div class="flex items-center gap-2 text-label-sm font-label-sm text-on-surface-variant mb-2">
          <span class="text-primary font-bold">${escapeHtml(p.nickname || '익명')}</span>
          <span>${formatDate(p.createdAt)}</span>
        </div>
        <p class="text-body-md font-body-md text-on-surface-variant leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(p.content)}</p>
      </div>
    `).join('');
  }

  async function fetchPosts(){
    bPostsEl.innerHTML = '<div class="text-center text-label-sm font-label-sm text-on-surface-variant py-10 border border-dashed border-outline-variant rounded-2xl">불러오는 중...</div>';
    try{
      const res = await fetch('/api/board');
      const data = await res.json();
      if(!res.ok){
        bPostsEl.innerHTML = `<div class="text-center text-label-sm font-label-sm text-tertiary py-10 border border-dashed border-outline-variant rounded-2xl">${escapeHtml(data.error || '게시글을 불러오지 못했습니다.')}</div>`;
        return;
      }
      renderPosts(data.posts || []);
    } catch(err){
      bPostsEl.innerHTML = '<div class="text-center text-label-sm font-label-sm text-tertiary py-10 border border-dashed border-outline-variant rounded-2xl">서버에 연결할 수 없습니다. 네트워크 상태를 확인해주세요.</div>';
    }
  }

  async function submitPost(){
    const nickname = bNickname.value.trim();
    const title = bTitle.value.trim();
    const content = bContent.value.trim();

    if(!title){
      showBoardError('제목을 입력해주세요.');
      bTitle.focus();
      return;
    }
    if(!content){
      showBoardError('내용을 입력해주세요.');
      bContent.focus();
      return;
    }
    clearBoardError();

    postBtn.disabled = true;
    try{
      const res = await fetch('/api/board', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, title, content })
      });
      const data = await res.json();

      if(!res.ok){
        showBoardError(data.error || '게시에 실패했습니다.');
        return;
      }

      bTitle.value = '';
      bContent.value = '';
      fetchPosts();
    } catch(err){
      showBoardError('서버에 연결할 수 없습니다. 네트워크 상태를 확인해주세요.');
    } finally {
      postBtn.disabled = false;
    }
  }

  postBtn.addEventListener('click', submitPost);
  bContent.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      e.preventDefault();
      submitPost();
    }
  });

  bPostsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.post-del');
    if(!btn) return;
    const id = btn.dataset.id;
    if(!confirm('이 글을 삭제할까요?')) return;

    btn.disabled = true;
    try{
      const res = await fetch('/api/board?id=' + encodeURIComponent(id), { method: 'DELETE' });
      if(!res.ok){
        const data = await res.json().catch(() => ({}));
        alert(data.error || '삭제에 실패했습니다.');
        btn.disabled = false;
        return;
      }
      fetchPosts();
    } catch(err){
      alert('서버에 연결할 수 없습니다.');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
