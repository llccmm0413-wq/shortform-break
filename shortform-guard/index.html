<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>숏츠 브레이크 · 숏폼 절제 도우미</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0a0a' stroke='%23242424' stroke-width='2'/%3E%3Cpath d='M32 4 A28 28 0 0 1 60 30' fill='none' stroke='%23ff3b30' stroke-width='3' stroke-linecap='round'/%3E%3Crect x='21' y='15' width='20' height='30' rx='6' fill='%23141414' stroke='%23ff3b30' stroke-width='2.5'/%3E%3Cpath d='M27 23 L37 30 L27 37 Z' fill='%23ff3b30'/%3E%3Ccircle cx='46' cy='19' r='10' fill='%230a0a0a' stroke='%23ff3b30' stroke-width='2.5'/%3E%3Cline x1='40.5' y1='24.5' x2='51.5' y2='13.5' stroke='%23ff3b30' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg-0:#050505;
    --bg-1:#0d0d0d;
    --bg-2:#141414;
    --line:#242424;
    --red:#ff3b30;
    --red-dim:#7a1f1a;
    --red-glow: rgba(255,59,48,0.35);
    --text-0:#f2f0ee;
    --text-1:#a8a5a2;
    --text-2:#6b6866;
    --font-display: 'Space Grotesk', 'Pretendard', -apple-system, sans-serif;
    --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin:0;
    padding:0;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: var(--font-body);
    height:100%;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,59,48,0.10), transparent 45%),
      var(--bg-0);
  }

  /* subtle scanline / noise texture on background */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding: 28px 20px 20px;
  }

  /* ---------- Header / Icon ---------- */
  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding: 18px 0 26px;
  }

  .mark{
    width:64px;
    height:64px;
    margin-bottom:14px;
    filter: drop-shadow(0 0 18px var(--red-glow));
    animation: pulse 3.2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100% { filter: drop-shadow(0 0 12px var(--red-glow)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 22px var(--red-glow)); transform: scale(1.03); }
  }

  .mark .ring{
    transform-origin: 32px 32px;
    animation: spin 5s linear infinite;
  }

  @keyframes spin{
    to { transform: rotate(360deg); }
  }

  .mark .badge-slash{
    transform-origin: 46px 19px;
    animation: badge-pop 3.2s ease-in-out infinite;
  }

  @keyframes badge-pop{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  h1{
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    font-weight: 700;
  }
  h1 .accent{ color: var(--red); }

  header p{
    margin:0;
    color: var(--text-1);
    font-size: 13.5px;
    line-height:1.5;
    max-width: 380px;
  }

  /* ---------- Chat panel ---------- */
  .panel{
    flex:1;
    display:flex;
    flex-direction:column;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(255,59,48,0.05), 0 30px 60px -30px rgba(255,59,48,0.25);
  }

  .panel-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,59,48,0.04);
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red-glow);
  }
  .panel-head span{
    font-size:12.5px;
    color: var(--text-1);
    letter-spacing: 0.03em;
  }

  .messages{
    flex:1;
    padding: 18px;
    display:flex;
    flex-direction:column;
    gap: 14px;
    overflow-y:auto;
    min-height: 320px;
    max-height: 52vh;
  }

  .messages::-webkit-scrollbar{ width:6px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }

  .msg{
    max-width: 88%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    animation: rise 0.25s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .msg.system{
    align-self:flex-start;
    background: var(--bg-1);
    border: 1px solid var(--line);
    color: var(--text-1);
  }

  .msg.user{
    align-self:flex-end;
    background: var(--red);
    color: #1a0402;
    font-weight:500;
    border-bottom-right-radius: 4px;
  }

  .msg.ai{
    align-self:flex-start;
    background: var(--bg-2);
    border: 1px solid var(--red-dim);
    border-bottom-left-radius: 4px;
    color: var(--text-0);
  }

  .msg.ai .badge{
    display:inline-block;
    font-size:10.5px;
    color: var(--red);
    letter-spacing:0.08em;
    margin-bottom:6px;
    font-weight:700;
  }

  .msg.error{
    align-self:flex-start;
    background: rgba(255,59,48,0.1);
    border: 1px solid var(--red);
    color: #ffb3ad;
  }

  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding: 12px 14px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background: var(--red);
    opacity:0.4;
    animation: blink 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes blink{
    0%, 80%, 100% { opacity:0.25; }
    40% { opacity:1; }
  }

  /* ---------- Input row ---------- */
  .input-row{
    display:flex;
    gap:10px;
    padding: 14px;
    border-top: 1px solid var(--line);
    background: var(--bg-1);
  }

  textarea{
    flex:1;
    resize:none;
    background: var(--bg-0);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text-0);
    padding: 12px 14px;
    font-size: 14px;
    font-family: var(--font-body);
    line-height:1.5;
    min-height: 46px;
    max-height: 120px;
    outline:none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea::placeholder{ color: var(--text-2); }
  textarea:focus{
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,59,48,0.15);
  }

  button#sendBtn{
    flex-shrink:0;
    width:46px;
    height:46px;
    border-radius:12px;
    border:none;
    background: var(--red);
    color:#1a0402;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.12s, filter 0.12s;
  }
  button#sendBtn:hover{ filter:brightness(1.08); }
  button#sendBtn:active{ transform: scale(0.94); }
  button#sendBtn:disabled{ opacity:0.4; cursor:not-allowed; }

  .hint{
    text-align:center;
    color: var(--text-2);
    font-size: 11.5px;
    margin-top: 14px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 420px){
    .app{ padding: 18px 12px 12px; }
    .messages{ max-height: 58vh; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="숏츠 브레이크 로고: 숏폼 재생 프레임과 제한 배지의 합성 아이콘">
      <!-- 배경 원 -->
      <circle cx="32" cy="32" r="29" fill="#0a0a0a" stroke="#242424" stroke-width="1.5"/>

      <!-- 회전하는 진행 링 -->
      <g class="ring">
        <path d="M32 4 A28 28 0 0 1 60 30" fill="none" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- 숏폼 영상 프레임 (세로형) + 재생 버튼 -->
      <rect x="21" y="15" width="20" height="30" rx="6" fill="#141414" stroke="#ff3b30" stroke-width="2.2"/>
      <path d="M27 23 L37 30 L27 37 Z" fill="#ff3b30"/>

      <!-- 제한(금지) 배지: 재생 프레임 위에 합성 -->
      <g class="badge-slash">
        <circle cx="46" cy="19" r="10.5" fill="#0a0a0a" stroke="#ff3b30" stroke-width="2.5"/>
        <line x1="40" y1="25" x2="52" y2="13" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </svg>
    <h1>숏츠 브레이크 <span class="accent">·</span> 숏폼 절제 도우미</h1>
    <p>줄이고 싶은 숏폼 습관을 말해주면, AI가 상황에 맞는 제한 기능을 설계해드려요.</p>
  </header>

  <div class="panel">
    <div class="panel-head">
      <span class="dot"></span>
      <span>AI 분석 세션 · 연결됨</span>
    </div>

    <div class="messages" id="messages">
      <div class="msg system">예시: "밤에 유튜브 쇼츠를 2시간씩 봐요, 잠들기 전에 멈추고 싶어요" 처럼 편하게 적어주세요.</div>
    </div>

    <div class="input-row">
      <textarea id="input" placeholder="숏폼 제한을 위해 어떤 기능이 필요한지 적어주세요..." rows="1"></textarea>
      <button id="sendBtn" aria-label="전송">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="#1a0402" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="hint">Gemini 기반 · 입력한 내용은 기능 추천 목적 외에 저장되지 않습니다</div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function addMessage(role, text){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if(role === 'ai'){
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = 'AI 추천 기능';
      div.appendChild(badge);
      const body = document.createElement('div');
      body.textContent = text;
      div.appendChild(body);
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping(){
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping(){
    const el = document.getElementById('typingIndicator');
    if(el) el.remove();
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text) return;

    addMessage('user', text);
    input.value = '';
    autoGrow();
    sendBtn.disabled = true;
    addTyping();

    try{
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      removeTyping();

      if(!res.ok){
        addMessage('error', data.error || '요청 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
        return;
      }

      addMessage('ai', data.result);
    } catch(err){
      removeTyping();
      addMessage('error', '서버에 연결할 수 없습니다. 네트워크 상태를 확인해주세요.');
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
